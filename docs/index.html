<!DOCTYPE html>
<html lang="en">
<head>

    <title>Square Image Grid</title>

  <style>
    /* Base styles for both versions */
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    /* Styles for desktop version */
    .desktop {
        display: block; /* Show by default */
    }
    .mobile {
        display: none; /* Hide by default */
    }

    /* Media query for mobile version */
    @media (max-width: 768px) {
        .desktop {
            display: none; /* Hide desktop version on small screens */
        }
        .mobile {
            display: block; /* Show mobile version */
        }
    }
  </style>
